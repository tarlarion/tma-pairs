<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Memory pairs</title>
  <link rel="stylesheet" href="../tma-shared/tma-theme.css" />
  <link rel="stylesheet" href="../tma-shared/tma-loading.css" />
  <link rel="stylesheet" href="game.css" />
</head>
<body>
  <div class="celebration-confetti" id="celebration-confetti" aria-hidden="true"></div>
  <div class="finish-fx" id="finish-fx" aria-hidden="true">
    <span class="finish-orb"></span>
    <span class="finish-orb"></span>
    <span class="finish-spark"></span>
    <span class="finish-spark"></span>
    <span class="finish-spark"></span>
    <span class="finish-spark"></span>
    <span class="finish-spark"></span>
    <span class="finish-spark"></span>
    <span class="finish-spark"></span>
    <span class="finish-spark"></span>
    <span class="finish-ray"></span>
    <span class="finish-burst"></span>
    <span class="finish-burst finish-burst--alt"></span>
    <span class="finish-spotlight finish-spotlight--a"></span>
    <span class="finish-spotlight finish-spotlight--b"></span>
    <span class="finish-spotlight finish-spotlight--c"></span>
    <span class="finish-spotlight finish-spotlight--d"></span>
  </div>
  <div class="app">
    <!-- Стартовый экран -->
    <div id="screen-start" class="screen active">
      <h1 class="start-title" id="start-title"></h1>
      <p class="start-desc" id="start-desc"></p>
      <button type="button" class="btn" id="btn-start"></button>
    </div>

    <!-- Игровой экран -->
    <div id="screen-game" class="screen">
      <div class="hooray" id="hooray" aria-live="polite"></div>
      <div class="game-header">
        <span class="game-score" id="game-score"><span id="game-score-label"></span> <span id="score-count">0</span></span>
        <span class="timer" id="timer">60</span>
      </div>
      <div class="game-progress" aria-hidden="true">
        <div class="game-progress-fill" id="timer-progress"></div>
      </div>
      <div class="preview-banner" id="preview-banner" aria-live="polite">
        <p class="preview-banner-title" id="preview-banner-title"></p>
      </div>
      <div class="cards-grid" id="cards-grid"></div>
    </div>

    <!-- Финишный экран: phase-score → Continue → phase-reward -->
    <div id="screen-finish" class="screen">
      <div class="finish-header">
        <div class="finish-header-top">
          <h2 class="finish-title" id="finish-title"></h2>
          <div class="finish-score-block">
            <div class="finish-score" id="finish-score">0</div>
            <div class="finish-score-label" id="finish-score-label"></div>
          </div>
        </div>
        <div class="finish-token-reward" id="finish-token-reward" aria-live="polite">
          <div class="finish-token-badge">
            <div class="finish-token-row">
              <span class="finish-token-icon" aria-hidden="true"></span>
              <span class="finish-token-count" id="finish-token-count">0</span>
            </div>
            <p class="finish-token-label" id="finish-token-label"></p>
          </div>
        </div>
      </div>
      <div class="finish-chest-stage" id="finish-chest-stage" aria-hidden="true">
        <div class="treasure-chest">
          <div class="chest-light-beam" aria-hidden="true"></div>
          <div class="chest-shadow"></div>
          <div class="chest-cavity">
            <div class="chest-glow"></div>
            <div class="chest-coins">
              <span class="chest-coin"></span>
              <span class="chest-coin"></span>
              <span class="chest-coin"></span>
              <span class="chest-coin"></span>
              <span class="chest-coin"></span>
            </div>
          </div>
          <div class="chest-volume" aria-hidden="true">
            <div class="chest-volume-rim"></div>
            <div class="chest-volume-back"></div>
          </div>
          <div class="chest-body">
            <div class="chest-plank"></div>
            <div class="chest-plank"></div>
          </div>
          <div class="chest-shell-back" aria-hidden="true"></div>
          <div class="chest-lock"></div>
          <div class="chest-lid">
            <div class="chest-lid-dome"></div>
            <div class="chest-lid-inner"></div>
          </div>
          <div class="chest-coin-burst" id="chest-coin-burst" aria-hidden="true"></div>
          <div class="chest-token-rise" id="chest-token-rise" aria-hidden="true">
            <span class="finish-token-icon chest-token-icon"></span>
          </div>
          <span class="chest-sparkle"></span>
          <span class="chest-sparkle"></span>
          <span class="chest-sparkle"></span>
          <span class="chest-sparkle"></span>
          <span class="chest-sparkle"></span>
          <span class="chest-sparkle"></span>
        </div>
      </div>
      <div class="finish-score-actions" id="finish-score-actions">
        <div class="finish-buttons finish-buttons--score">
          <button type="button" class="btn btn-finish-share" id="btn-finish-share"></button>
          <button type="button" class="btn" id="btn-finish-continue"></button>
        </div>
      </div>
      <div class="finish-results" id="finish-results">
        <div class="finish-buttons">
          <button type="button" class="btn" id="btn-repeat"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- Locales: JSON sources are locales/en.json + locales/ru.json; run `node locales/build-messages.js` after editing them. -->
  <script src="locales/messages.js"></script>
  <script src="../tma-shared/tma-loading.js"></script>
  <script src="../tma-shared/tma-profile-store.js"></script>
  <script>
    (function () {
      const SUPPORTED_LOCALES = ['ru', 'en'];
      const DEFAULT_LOCALE = 'en';
      const urlParams = new URLSearchParams(window.location.search);
      /** Set to 0 to skip fake delay; replace with real preload tasks in `tasks`. */
      const LOADING_EMULATE_MS = 3000;
      const TOTAL_SEC = urlParams.get('time') ? Math.max(3, Number(urlParams.get('time')) || 60) : 60;
      const PREVIEW_MS = 3000;
      const ANIMALS = ['🌳','🌲','🌵','🌸','🌼','🌷','🌻','🍄','🪷','🌾','🍃','🌿','🌙','☘️','🌴','🌧️'];
      const PAIRS_PER_ROUND = 6;
      const CONFETTI_COLORS = ['#9dd9a8', '#4a9d5c', '#fbbf24', '#f472b6', '#a78bfa', '#34d399', '#f87171', '#fff'];
      const CONFETTI_SHAPES = ['rect', 'circle', 'star'];
      const CHEST_CLAIM_LIFT_MS = 600;
      const CHEST_CLAIM_FX_MS = 500;
      const FINISH_READY_DELAY_MS = 1050;
      const FINISH_TOKEN_COUNTUP_MS = 700;
      const FINISH_TOKEN_REVEAL_DELAY_MS = 1850;
      const TOKENS_PER_PAIR = 1;

      function detectLocale() {
        const params = new URLSearchParams(window.location.search);
        const fromQuery = params.get('lang');
        if (fromQuery) {
          const base = fromQuery.toLowerCase().split('-')[0];
          if (SUPPORTED_LOCALES.includes(base)) return base;
        }
        const candidates = navigator.languages && navigator.languages.length
          ? navigator.languages
          : [navigator.language];
        for (let i = 0; i < candidates.length; i++) {
          const tag = candidates[i];
          if (!tag) continue;
          const lower = tag.toLowerCase();
          const base = lower.split('-')[0];
          if (SUPPORTED_LOCALES.includes(lower)) return lower;
          if (SUPPORTED_LOCALES.includes(base)) return base;
        }
        return DEFAULT_LOCALE;
      }

      function resolveMessages(locale) {
        const bundle = window.TMA_I18N;
        if (!bundle || typeof bundle !== 'object') {
          console.error('Missing window.TMA_I18N — load locales/messages.js before this script.');
          return {};
        }
        const chosen = bundle[locale] || bundle[DEFAULT_LOCALE];
        if (chosen && typeof chosen === 'object') return chosen;
        return bundle[DEFAULT_LOCALE] && typeof bundle[DEFAULT_LOCALE] === 'object'
          ? bundle[DEFAULT_LOCALE]
          : {};
      }

      let messages = {};

      function t(key) {
        const parts = key.split('.');
        let cur = messages;
        for (let i = 0; i < parts.length; i++) {
          if (cur == null || typeof cur !== 'object') return key;
          cur = cur[parts[i]];
        }
        if (typeof cur === 'string' || typeof cur === 'number') return String(cur);
        return key;
      }

      function tArray(key) {
        const parts = key.split('.');
        let cur = messages;
        for (let i = 0; i < parts.length; i++) {
          if (cur == null || typeof cur !== 'object') return [];
          cur = cur[parts[i]];
        }
        return Array.isArray(cur) ? cur : [];
      }

      const activeLocale = detectLocale();
      messages = resolveMessages(activeLocale);
      document.documentElement.lang = activeLocale === 'ru' ? 'ru' : 'en';

      const screenStart = document.getElementById('screen-start');
      const screenGame = document.getElementById('screen-game');
      const screenFinish = document.getElementById('screen-finish');
      const btnStart = document.getElementById('btn-start');
      const btnRepeat = document.getElementById('btn-repeat');
      const btnFinishShare = document.getElementById('btn-finish-share');
      const btnFinishContinue = document.getElementById('btn-finish-continue');
      const timerEl = document.getElementById('timer');
      const timerProgressEl = document.getElementById('timer-progress');
      const scoreCountEl = document.getElementById('score-count');
      const gameScoreLabelEl = document.getElementById('game-score-label');
      const cardsGrid = document.getElementById('cards-grid');
      const previewBanner = document.getElementById('preview-banner');
      const previewBannerTitleEl = document.getElementById('preview-banner-title');
      const finishScore = document.getElementById('finish-score');
      const finishTokenReward = document.getElementById('finish-token-reward');
      const finishTokenCount = document.getElementById('finish-token-count');
      const finishTokenLabel = document.getElementById('finish-token-label');
      const finishResults = document.getElementById('finish-results');
      const hoorayEl = document.getElementById('hooray');
      const confettiContainer = document.getElementById('celebration-confetti');
      const finishFx = document.getElementById('finish-fx');
      const chestCoinBurst = document.getElementById('chest-coin-burst');
      const CHEST_BURST_COIN_COUNT = 16;

      function applyStaticCopy() {
        document.title = t('meta.title');
        document.getElementById('start-title').textContent = t('start.title');
        document.getElementById('start-desc').textContent = t('start.description');
        btnStart.textContent = t('start.buttonStart');
        hoorayEl.textContent = t('game.hoorayFallback');
        gameScoreLabelEl.textContent = t('game.pairsFoundLabel');
        previewBannerTitleEl.textContent = t('game.previewTitle');
        cardsGrid.setAttribute('aria-label', t('game.cardsGridAriaLabel'));
        document.getElementById('finish-title').textContent = t('finish.title');
        document.getElementById('finish-score-label').textContent = t('finish.scoreLabel');
        finishTokenLabel.textContent = t('finish.tokensLabel');
        finishTokenReward.setAttribute(
          'aria-label',
          t('finish.tokensLabel')
        );
        btnFinishShare.textContent = t('finish.buttonShare');
        btnFinishContinue.textContent = t('finish.buttonContinue');
        btnRepeat.textContent = t('finish.buttonClaimReward');
      }

      applyStaticCopy();

      function playCelebration() {
        const phrases = tArray('game.celebrationPhrases');
        const phrase = phrases.length
          ? phrases[Math.floor(Math.random() * phrases.length)]
          : t('game.hoorayFallback');
        hoorayEl.textContent = phrase;
        hoorayEl.classList.remove('play');
        void hoorayEl.offsetWidth;
        hoorayEl.classList.add('play');
        setTimeout(() => hoorayEl.classList.remove('play'), 1100);

        confettiContainer.innerHTML = '';
        const count = 55;
        for (let i = 0; i < count; i++) {
          const piece = document.createElement('div');
          piece.className = 'confetti-piece ' + CONFETTI_SHAPES[Math.floor(Math.random() * CONFETTI_SHAPES.length)] + ' fall';
          piece.style.background = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
          const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
          const dist = 80 + Math.random() * 250;
          const tx = Math.cos(angle) * dist + (Math.random() - 0.5) * 80;
          const ty = Math.sin(angle) * dist + (Math.random() - 0.5) * 80 + 100;
          piece.style.setProperty('--confetti-end', `translate(${tx}px, ${ty}px)`);
          piece.style.setProperty('--confetti-rotate', (Math.random() * 720 - 360) + 'deg');
          piece.style.animationDelay = (Math.random() * 0.3) + 's';
          const size = 6 + Math.random() * 8;
          piece.style.width = size + 'px';
          piece.style.height = size + 'px';
          piece.style.marginLeft = (-size / 2) + 'px';
          piece.style.marginTop = (-size / 2) + 'px';
          confettiContainer.appendChild(piece);
        }
        for (let s = 0; s < 8; s++) {
          const spark = document.createElement('div');
          spark.className = 'confetti-piece sparkle';
          const a = Math.random() * Math.PI * 2;
          const d = 40 + Math.random() * 60;
          const sx = Math.cos(a) * d;
          const sy = Math.sin(a) * d;
          spark.style.setProperty('--confetti-end', `translate(${sx}px, ${sy}px)`);
          spark.style.animationDelay = (Math.random() * 0.15) + 's';
          confettiContainer.appendChild(spark);
        }
        setTimeout(() => { confettiContainer.innerHTML = ''; }, 2500);
      }

      function clearChestBurstCoins() {
        if (!chestCoinBurst) return;
        chestCoinBurst.innerHTML = '';
      }

      function spawnChestBurstCoins() {
        if (!chestCoinBurst) return;
        clearChestBurstCoins();
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const count = reducedMotion ? 6 : CHEST_BURST_COIN_COUNT;
        const fragment = document.createDocumentFragment();
        for (let i = 0; i < count; i++) {
          const coin = document.createElement('span');
          coin.className = 'chest-burst-coin';
          const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.5;
          const dist = 80 + Math.random() * 150;
          const fx = Math.cos(angle) * dist;
          const fy = Math.sin(angle) * dist;
          coin.style.setProperty('--fly-x', fx + 'px');
          coin.style.setProperty('--fly-y', fy + 'px');
          coin.style.setProperty('--spin', (Math.random() * 600 - 300) + 'deg');
          const size = 14 + Math.random() * 14;
          coin.style.width = size + 'px';
          coin.style.height = Math.max(8, size * 0.52) + 'px';
          coin.style.marginLeft = (-size / 2) + 'px';
          coin.style.marginTop = (-size * 0.26) + 'px';
          coin.style.animationDelay = (Math.random() * 0.22) + 's';
          coin.style.animationDuration = (0.95 + Math.random() * 0.55) + 's';
          fragment.appendChild(coin);
        }
        chestCoinBurst.appendChild(fragment);
        setTimeout(clearChestBurstCoins, 2200);
      }

      let finishConfettiRainId = null;
      let finishConfettiRainLast = 0;
      let finishConfettiCount = 0;
      const MAX_FINISH_CONFETTI = 140;
      const FINISH_CONFETTI_RAIN_MS = 180;

      function stopFinishConfettiRain() {
        if (finishConfettiRainId) {
          cancelAnimationFrame(finishConfettiRainId);
          finishConfettiRainId = null;
        }
      }

      function trimFinishConfetti() {
        if (!finishFx || finishConfettiCount <= MAX_FINISH_CONFETTI) return;
        const removeCount = finishConfettiCount - MAX_FINISH_CONFETTI;
        const pieces = finishFx.querySelectorAll('.finish-confetti-piece');
        for (let i = 0; i < removeCount && i < pieces.length; i++) {
          pieces[i].remove();
          finishConfettiCount -= 1;
        }
      }

      function appendFinishConfettiPiece(piece) {
        if (!finishFx) return;
        finishFx.appendChild(piece);
        finishConfettiCount += 1;
        trimFinishConfetti();
      }

      function clearFinishConfetti() {
        stopFinishConfettiRain();
        if (!finishFx) return;
        finishFx.querySelectorAll('.finish-confetti-piece').forEach(function (el) {
          el.remove();
        });
        finishConfettiCount = 0;
      }

      function burstDistToEdge(angle) {
        const originX = window.innerWidth * 0.5;
        const originY = window.innerHeight * 0.42;
        const cos = Math.cos(angle);
        const sin = Math.sin(angle);
        let t = Infinity;
        if (cos > 0.001) t = Math.min(t, (window.innerWidth - originX) / cos);
        if (cos < -0.001) t = Math.min(t, originX / -cos);
        if (sin > 0.001) t = Math.min(t, (window.innerHeight - originY) / sin);
        if (sin < -0.001) t = Math.min(t, originY / -sin);
        if (!isFinite(t) || t <= 0) t = 220;
        return t * (0.82 + Math.random() * 0.16);
      }

      function randomScreenScatterOffset() {
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const targetX = vw * (0.04 + Math.random() * 0.92);
        const targetY = vh * (0.04 + Math.random() * 0.9);
        return {
          x: targetX - vw * 0.5,
          y: targetY - vh * 0.42,
        };
      }

      function createBurstConfettiPiece() {
        const piece = document.createElement('span');
        const shape = CONFETTI_SHAPES[Math.floor(Math.random() * CONFETTI_SHAPES.length)];
        piece.className = 'finish-confetti-piece ' + shape;
        piece.style.background = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
        piece.style.left = '50%';
        piece.style.top = '42%';
        const roll = Math.random();
        let bx;
        let by;
        if (roll < 0.22) {
          const angle = Math.random() * Math.PI * 2;
          const dist = burstDistToEdge(angle);
          bx = Math.cos(angle) * dist;
          by = Math.sin(angle) * dist;
        } else if (roll < 0.5) {
          const angle = Math.random() * Math.PI * 2;
          const dist = 70 + Math.random() * 200;
          bx = Math.cos(angle) * dist;
          by = Math.sin(angle) * dist * 0.8;
        } else {
          const scatter = randomScreenScatterOffset();
          bx = scatter.x;
          by = scatter.y;
        }
        piece.style.setProperty('--burst-x', bx + 'px');
        piece.style.setProperty('--burst-y', by + 'px');
        piece.style.setProperty('--spin', (Math.random() * 900 - 450) + 'deg');
        piece.style.setProperty('--burst-dur', (0.45 + Math.random() * 0.4) + 's');
        piece.style.setProperty('--fall-dur', (2.2 + Math.random() * 2.4) + 's');
        piece.style.setProperty('--burst-delay', (Math.random() * 0.1) + 's');
        const size = 6 + Math.random() * 9;
        piece.style.width = size + 'px';
        piece.style.height = (shape === 'rect' ? size * 1.35 : size) + 'px';
        return piece;
      }

      function spawnRainConfettiPiece() {
        const piece = document.createElement('span');
        const shape = CONFETTI_SHAPES[Math.floor(Math.random() * CONFETTI_SHAPES.length)];
        piece.className = 'finish-confetti-piece finish-confetti-piece--rain ' + shape;
        piece.style.background = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
        piece.style.left = (3 + Math.random() * 94) + '%';
        piece.style.top = (-4 + Math.random() * 8) + '%';
        piece.style.setProperty('--spin', (Math.random() * 720 - 360) + 'deg');
        piece.style.setProperty('--drift-x', (Math.random() * 50 - 25) + 'px');
        piece.style.setProperty('--fall-dur', (2.4 + Math.random() * 2.8) + 's');
        piece.style.setProperty('--rain-delay', (Math.random() * 0.4) + 's');
        const size = 5 + Math.random() * 8;
        piece.style.width = size + 'px';
        piece.style.height = (shape === 'rect' ? size * 1.3 : size) + 'px';
        return piece;
      }

      function finishConfettiRainTick(now) {
        if (!finishConfettiRainId) return;
        if (!screenFinish.classList.contains('active') || document.hidden) {
          stopFinishConfettiRain();
          return;
        }
        if (now - finishConfettiRainLast >= FINISH_CONFETTI_RAIN_MS) {
          finishConfettiRainLast = now;
          appendFinishConfettiPiece(spawnRainConfettiPiece());
          if (Math.random() > 0.5) appendFinishConfettiPiece(spawnRainConfettiPiece());
        }
        finishConfettiRainId = requestAnimationFrame(finishConfettiRainTick);
      }

      function startFinishConfettiRain() {
        stopFinishConfettiRain();
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        finishConfettiRainLast = 0;
        finishConfettiRainId = requestAnimationFrame(finishConfettiRainTick);
      }

      function spawnFinishConfetti() {
        if (!finishFx) return;
        clearFinishConfetti();
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const count = reducedMotion ? 20 : 48;
        const fragment = document.createDocumentFragment();
        for (let i = 0; i < count; i++) {
          fragment.appendChild(createBurstConfettiPiece());
        }
        finishFx.appendChild(fragment);
        finishConfettiCount = count;
        startFinishConfettiRain();
      }

      let timerId = null;
      let previewTimeoutId = null;
      let gameStartTime = 0;
      let correctCount = 0;
      let sessionStartedAt = null;
      let firstOpenIndex = null;
      let isBoardLocked = false;
      let isPreviewPhase = false;
      let currentField = [];

      function clearPreviewTimeout() {
        if (previewTimeoutId) {
          clearTimeout(previewTimeoutId);
          previewTimeoutId = null;
        }
      }

      function hidePreviewBanner() {
        previewBanner.classList.remove('is-active');
      }

      function showPreviewBanner() {
        previewBannerTitleEl.textContent = t('game.previewTitle');
        previewBanner.classList.add('is-active');
      }

      function endMemorizePreviewCommon() {
        hidePreviewBanner();
        isPreviewPhase = false;
        isBoardLocked = false;
        cardsGrid.classList.remove('cards-grid--preview');
        cardsGrid.querySelectorAll('.card:not(.matched)').forEach(function (el) {
          el.classList.remove('open');
        });
      }

      function beginMemorizePreview(onComplete) {
        clearPreviewTimeout();
        isPreviewPhase = true;
        isBoardLocked = true;
        firstOpenIndex = null;
        cardsGrid.querySelectorAll('.card').forEach(function (el) {
          el.classList.add('open');
        });
        cardsGrid.classList.add('cards-grid--preview');
        showPreviewBanner();
        previewTimeoutId = setTimeout(function () {
          previewTimeoutId = null;
          onComplete();
        }, PREVIEW_MS);
      }

      function endInitialMemorizePreview() {
        endMemorizePreviewCommon();
        gameStartTime = Date.now();
        timerId = setInterval(tick, TICK_MS);
      }

      function endInterRoundMemorizePreview(secondsLeftFrozen) {
        endMemorizePreviewCommon();
        gameStartTime = Date.now() - (TOTAL_SEC - secondsLeftFrozen) * 1000;
        timerId = setInterval(tick, TICK_MS);
      }

      let claimTimeoutId = null;
      let claimLidEl = null;
      let claimNavDone = false;
      let finishReadyTimeoutId = null;
      let finishTokenCountupId = null;
      let trainTokensEarned = 0;
      let finishTokenCountupStarted = false;

      function clearFinishReadyTimers() {
        if (finishReadyTimeoutId) {
          clearTimeout(finishReadyTimeoutId);
          finishReadyTimeoutId = null;
        }
        if (finishTokenCountupId) {
          cancelAnimationFrame(finishTokenCountupId);
          finishTokenCountupId = null;
        }
      }

      function calculateTrainTokens(pairsFound) {
        const pairs = Math.max(0, Number(pairsFound) || 0);
        return pairs * TOKENS_PER_PAIR;
      }

      function formatTokenCount(value) {
        return String(Math.max(0, Math.round(value)));
      }

      function resetFinishTokenDisplay() {
        finishTokenCount.textContent = '0';
        finishTokenCount.dataset.value = '0';
      }

      function animateFinishTokenCount(target) {
        if (finishTokenCountupId) {
          cancelAnimationFrame(finishTokenCountupId);
          finishTokenCountupId = null;
        }
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reducedMotion || target <= 0) {
          finishTokenCount.classList.remove('is-counting');
          finishTokenCount.textContent = formatTokenCount(target);
          finishTokenCount.dataset.value = String(target);
          return;
        }

        finishTokenCount.classList.add('is-counting');
        const startedAt = performance.now();
        function tick(now) {
          const progress = Math.min(1, (now - startedAt) / FINISH_TOKEN_COUNTUP_MS);
          const eased = 1 - Math.pow(1 - progress, 3);
          const current = Math.round(target * eased);
          finishTokenCount.textContent = formatTokenCount(current);
          if (progress < 1) {
            finishTokenCountupId = requestAnimationFrame(tick);
            return;
          }
          finishTokenCountupId = null;
          finishTokenCount.classList.remove('is-counting');
          finishTokenCount.textContent = formatTokenCount(target);
          finishTokenCount.dataset.value = String(target);
        }
        finishTokenCountupId = requestAnimationFrame(tick);
      }

      function startFinishTokenCountup() {
        if (finishTokenCountupStarted) return;
        finishTokenCountupStarted = true;
        animateFinishTokenCount(trainTokensEarned);
      }

      function onFinishTokenRevealStart(e) {
        if (e.target !== finishTokenReward || e.animationName !== 'finish-token-slot-open') return;
        startFinishTokenCountup();
      }

      function revealFinishReady() {
        if (!screenFinish.classList.contains('active')) return;
        if (screenFinish.classList.contains('finish-ready')) return;
        finishTokenCountupStarted = false;
        screenFinish.classList.add('finish-ready');
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reducedMotion) {
          startFinishTokenCountup();
          return;
        }
        finishTokenReward.addEventListener('animationstart', onFinishTokenRevealStart, { once: true });
        setTimeout(function () {
          finishTokenReward.removeEventListener('animationstart', onFinishTokenRevealStart);
          startFinishTokenCountup();
        }, FINISH_TOKEN_REVEAL_DELAY_MS + 1200);
      }

      function scheduleFinishReady() {
        clearFinishReadyTimers();
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reducedMotion) {
          revealFinishReady();
          return;
        }
        finishReadyTimeoutId = setTimeout(function () {
          finishReadyTimeoutId = null;
          revealFinishReady();
        }, FINISH_READY_DELAY_MS);
      }

      function clearClaimRewardHandlers() {
        if (claimTimeoutId) {
          clearTimeout(claimTimeoutId);
          claimTimeoutId = null;
        }
        if (claimLidEl) {
          claimLidEl.removeEventListener('animationend', onChestClaimAnimationEnd);
          claimLidEl = null;
        }
      }

      function persistTrainingSession() {
        if (!window.TMA_PROFILE_STORE || trainTokensEarned <= 0) return;
        window.TMA_PROFILE_STORE.recordSession({
          gameId: 'pairs',
          score: correctCount,
          tokens: trainTokensEarned,
          startedAt: sessionStartedAt || new Date().toISOString(),
          endedAt: new Date().toISOString(),
        });
      }

      function completeClaimReward() {
        if (claimNavDone) return;
        claimNavDone = true;
        persistTrainingSession();
        clearClaimRewardHandlers();
        showScreen(screenStart);
      }

      function onChestClaimAnimationEnd(e) {
        if (!claimLidEl || e.target !== claimLidEl) return;
        if (e.animationName !== 'chest-lid-claim-lift') return;
        if (claimTimeoutId) {
          clearTimeout(claimTimeoutId);
          claimTimeoutId = null;
        }
        claimTimeoutId = setTimeout(completeClaimReward, CHEST_CLAIM_FX_MS);
      }

      function showScreen(screen) {
        claimNavDone = false;
        screenStart.classList.remove('active');
        screenGame.classList.remove('active');
        screenFinish.classList.remove(
          'active',
          'finish-phase-score',
          'finish-phase-reward',
          'finish-play',
          'finish-ready',
          'finish-complete',
          'finish-claiming'
        );
        document.body.classList.remove('finish-active');
        clearClaimRewardHandlers();
        clearFinishReadyTimers();
        btnRepeat.disabled = false;
        btnFinishContinue.disabled = false;

        if (screen === screenFinish) {
          document.body.classList.add('finish-active');
          resetFinishTokenDisplay();
          finishTokenCountupStarted = false;
          document.getElementById('finish-title').textContent = t('finish.title');
          screenFinish.classList.add('active', 'finish-phase-score');
          spawnFinishConfetti();
          return;
        }

        clearFinishConfetti();
        clearChestBurstCoins();
        resetFinishTokenDisplay();
        trainTokensEarned = 0;
        screen.classList.add('active');
      }

      function enterFinishRewardPhase() {
        if (!screenFinish.classList.contains('active')) return;
        if (screenFinish.classList.contains('finish-phase-reward')) return;
        btnFinishContinue.disabled = true;
        document.getElementById('finish-title').textContent = t('finish.titleReward');
        screenFinish.classList.remove('finish-phase-score');
        screenFinish.classList.add('finish-phase-reward');
        void screenFinish.offsetWidth;
        screenFinish.classList.add('finish-play');
        scheduleFinishReady();
      }

      function getReferralId() {
        const fromUrl = urlParams.get('ref');
        if (fromUrl) return fromUrl;

        const tg = window.Telegram && window.Telegram.WebApp;
        const tgUserId = tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id;
        if (tgUserId) return String(tgUserId);

        try {
          const stored = localStorage.getItem('tma_pairs_ref_id');
          if (stored) return stored;
          const generated = 'u' + Math.random().toString(36).slice(2, 11);
          localStorage.setItem('tma_pairs_ref_id', generated);
          return generated;
        } catch (error) {
          return 'guest' + Date.now().toString(36);
        }
      }

      function buildReferralUrl(refId) {
        const url = new URL('index.html', window.location.href);
        url.searchParams.set('ref', refId);
        if (activeLocale !== DEFAULT_LOCALE) {
          url.searchParams.set('lang', activeLocale);
        }
        return url.toString();
      }

      function shareWithFriend() {
        const referralUrl = buildReferralUrl(getReferralId());
        const shareText = t('share.shareText');
        const tg = window.Telegram && window.Telegram.WebApp;
        const shareUrl = 'https://t.me/share/url?url=' + encodeURIComponent(referralUrl)
          + '&text=' + encodeURIComponent(shareText);

        if (tg && typeof tg.openTelegramLink === 'function') {
          tg.openTelegramLink(shareUrl);
          return;
        }

        if (navigator.share) {
          navigator.share({
            title: t('share.title'),
            text: shareText,
            url: referralUrl,
          }).catch(function (error) {
            if (error && error.name === 'AbortError') return;
          });
          return;
        }

        window.open(shareUrl, '_blank', 'noopener,noreferrer');
      }

      function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
      }

      function generateField() {
        const animals = shuffle(ANIMALS.slice()).slice(0, PAIRS_PER_ROUND);
        const cards = [];
        animals.forEach((emoji, idx) => {
          const pairId = idx;
          cards.push({ id: pairId * 2, pairId, emoji, matched: false });
          cards.push({ id: pairId * 2 + 1, pairId, emoji, matched: false });
        });
        shuffle(cards);
        currentField = cards;
      }

      function renderField() {
        cardsGrid.innerHTML = '';
        const cardAria = t('game.cardAriaLabel');
        currentField.forEach((card, index) => {
          const cardEl = document.createElement('button');
          cardEl.type = 'button';
          cardEl.className = 'card';
          cardEl.dataset.index = String(index);
          cardEl.setAttribute('aria-label', cardAria);

          const front = document.createElement('div');
          front.className = 'card-inner card-front';
          front.textContent = '✦';

          const back = document.createElement('div');
          back.className = 'card-inner card-back';
          back.textContent = card.emoji;

          cardEl.appendChild(front);
          cardEl.appendChild(back);

          if (card.matched) {
            cardEl.classList.add('matched', 'open');
          }

          cardEl.addEventListener('click', () => handleCardClick(index, cardEl));
          cardsGrid.appendChild(cardEl);
        });
      }

      function prepareFreshField() {
        firstOpenIndex = null;
        generateField();
        renderField();
      }

      function isBoardFullyMatched() {
        return currentField.length > 0 && currentField.every(function (c) {
          return c.matched;
        });
      }

      function handleCardClick(index, cardEl) {
        if (isPreviewPhase) return;
        if (isBoardLocked) return;
        const card = currentField[index];
        if (!card || card.matched) return;

        if (firstOpenIndex === index) return;

        cardEl.classList.add('open');

        if (firstOpenIndex === null) {
          firstOpenIndex = index;
          return;
        }

        const firstCard = currentField[firstOpenIndex];
        const firstEl = cardsGrid.querySelector('[data-index="' + firstOpenIndex + '"]');

        if (!firstCard || !firstEl) {
          firstOpenIndex = null;
          return;
        }

        isBoardLocked = true;

        if (firstCard.pairId === card.pairId) {
          firstCard.matched = true;
          card.matched = true;
          firstEl.classList.add('matched');
          cardEl.classList.add('matched');

          correctCount++;
          scoreCountEl.textContent = correctCount;
          playCelebration();

          setTimeout(function () {
            firstOpenIndex = null;
            if (!isBoardFullyMatched()) {
              isBoardLocked = false;
              return;
            }
            if (timerId) {
              clearInterval(timerId);
              timerId = null;
            }
            const secondsLeft = Math.max(0, TOTAL_SEC - (Date.now() - gameStartTime) / 1000);
            if (secondsLeft <= 0) {
              endGame();
              return;
            }
            prepareFreshField();
            beginMemorizePreview(function () {
              endInterRoundMemorizePreview(secondsLeft);
            });
          }, 800);
        } else {
          setTimeout(() => {
            firstEl.classList.remove('open');
            cardEl.classList.remove('open');
            isBoardLocked = false;
            firstOpenIndex = null;
          }, 700);
        }
      }

      const TICK_MS = 50;

      function tick() {
        const elapsed = (Date.now() - gameStartTime) / 1000;
        const timeRemaining = Math.max(0, TOTAL_SEC - elapsed);
        const pct = (timeRemaining / TOTAL_SEC) * 100;
        timerEl.textContent = timeRemaining.toFixed(2);
        timerProgressEl.style.width = pct + '%';
        if (timeRemaining <= 10) {
          timerEl.classList.add('warning');
          timerProgressEl.classList.add('warning');
        }
        if (timeRemaining <= 0) {
          clearInterval(timerId);
          timerId = null;
          endGame();
        }
      }

      function startGame() {
        clearPreviewTimeout();
        hidePreviewBanner();
        if (timerId) {
          clearInterval(timerId);
          timerId = null;
        }
        correctCount = 0;
        trainTokensEarned = 0;
        sessionStartedAt = new Date().toISOString();
        scoreCountEl.textContent = correctCount;
        timerEl.textContent = TOTAL_SEC.toFixed(2);
        timerEl.classList.remove('warning');
        timerProgressEl.style.width = '100%';
        timerProgressEl.classList.remove('warning');
        gameStartTime = 0;
        prepareFreshField();
        showScreen(screenGame);
        beginMemorizePreview(endInitialMemorizePreview);
      }

      function endGame() {
        clearPreviewTimeout();
        hidePreviewBanner();
        if (timerId) {
          clearInterval(timerId);
          timerId = null;
        }
        isPreviewPhase = false;
        isBoardLocked = false;
        cardsGrid.classList.remove('cards-grid--preview');
        finishScore.textContent = correctCount;
        trainTokensEarned = calculateTrainTokens(correctCount);
        const tokensOverride = urlParams.get('tokens');
        if (tokensOverride != null && tokensOverride !== '') {
          trainTokensEarned = Math.max(0, Number(tokensOverride) || 0);
        }
        finishTokenCount.dataset.value = String(trainTokensEarned);
        showScreen(screenFinish);
      }

      window.endGame = function (score) {
        if (score != null) correctCount = Number(score) || 0;
        endGame();
      };

      btnStart.addEventListener('click', startGame);
      btnFinishShare.addEventListener('click', function () {
        if (!screenFinish.classList.contains('finish-phase-score')) return;
        shareWithFriend();
      });
      btnFinishContinue.addEventListener('click', function () {
        if (!screenFinish.classList.contains('finish-phase-score')) return;
        enterFinishRewardPhase();
      });
      btnRepeat.addEventListener('click', function () {
        if (!screenFinish.classList.contains('active')) return;
        if (!screenFinish.classList.contains('finish-phase-reward')) return;
        if (screenFinish.classList.contains('finish-claiming')) return;
        screenFinish.classList.add('finish-claiming');
        btnRepeat.disabled = true;
        spawnChestBurstCoins();

        claimLidEl = screenFinish.querySelector('.chest-lid');
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!claimLidEl || reducedMotion) {
          claimTimeoutId = setTimeout(completeClaimReward, reducedMotion ? 80 : 0);
          return;
        }

        claimLidEl.addEventListener('animationend', onChestClaimAnimationEnd);
        claimTimeoutId = setTimeout(
          completeClaimReward,
          CHEST_CLAIM_LIFT_MS + CHEST_CLAIM_FX_MS + 120
        );
      });

      function boot() {
        document.addEventListener('visibilitychange', function () {
          if (document.hidden) {
            stopFinishConfettiRain();
            return;
          }
          if (screenFinish.classList.contains('active')) startFinishConfettiRain();
        });

        if (urlParams.get('end') === '1') {
          correctCount = 3;
          finishScore.textContent = '3';
          trainTokensEarned = calculateTrainTokens(correctCount);
          const tokensOverride = urlParams.get('tokens');
          if (tokensOverride != null && tokensOverride !== '') {
            trainTokensEarned = Math.max(0, Number(tokensOverride) || 0);
          }
          finishTokenCount.dataset.value = String(trainTokensEarned);
          showScreen(screenFinish);
          return;
        }
        showScreen(screenStart);
      }

      if (window.TMA_LOADING && typeof window.TMA_LOADING.run === 'function') {
        const skipLoadingDelay = urlParams.get('end') === '1';
        window.TMA_LOADING.run({
          title: t('meta.title'),
          status: t('loading.status'),
          icon: '✦',
          emulateMs: skipLoadingDelay ? 0 : LOADING_EMULATE_MS,
          onReady: boot,
        });
      } else {
        boot();
      }
    })();
  </script>
</body>
